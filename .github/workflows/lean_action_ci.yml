name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Axiom audit
        run: |
          ~/.elan/bin/lake env lean SimplexUniquenessLean/Audit/Axioms.lean > audit_output.txt
          test "$(tr '\n' ' ' < audit_output.txt | grep -o 'depends on axioms: \[[^]]*\]' | grep -vc 'propext,[ ]*Classical.choice,[ ]*Quot.sound')" = "0"
          echo "Axiom audit clean."
